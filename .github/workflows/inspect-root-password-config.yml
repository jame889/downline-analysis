name: Inspect Root Password Configuration

on:
  push:
    branches: [codex/check-root-password-config]
    paths: [.github/workflows/inspect-root-password-config.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Pull Production configuration
        run: npx vercel@56.3.1 pull --yes --environment=production --scope=bossjoes-projects --token=${{ secrets.VERCEL_TOKEN }}
      - name: Report non-secret credential metadata
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .vercel/.env.production.local
          set +a
          node --input-type=module <<'NODE'
          const url = process.env.SUPABASE_URL || ''
          const host = url ? new URL(url).host : 'not-configured'
          console.log('SUPABASE_HOST=' + host)
          console.log('ROOT_INITIAL_PASSWORD_CONFIGURED=' + Boolean(process.env.ROOT_INITIAL_PASSWORD))
          console.log('ROOT_INITIAL_PASSWORD_LENGTH=' + (process.env.ROOT_INITIAL_PASSWORD?.length || 0))
          NODE
