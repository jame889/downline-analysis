name: Inspect Root Password Configuration

on:
  push:
    branches: [codex/check-root-password-config]
    paths: [.github/workflows/inspect-root-password-config.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Pull Production configuration
        run: npx vercel@56.3.1 pull --yes --environment=production --scope=bossjoes-projects --token=${{ secrets.VERCEL_TOKEN }}
      - name: Report non-secret credential metadata
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .vercel/.env.production.local
          set +a
          node --input-type=module <<'NODE'
          const url = process.env.SUPABASE_URL || ''
          const host = url ? new URL(url).host : 'not-configured'
          console.log('SUPABASE_HOST=' + host)
          console.log('ROOT_INITIAL_PASSWORD_CONFIGURED=' + Boolean(process.env.ROOT_INITIAL_PASSWORD))
          console.log('ROOT_INITIAL_PASSWORD_LENGTH=' + (process.env.ROOT_INITIAL_PASSWORD?.length || 0))
          const base = process.env.SUPABASE_URL
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY
          if (!base || !key) throw new Error('Production Supabase unavailable')
          const headers = { apikey:key, Authorization:`Bearer ${key}` }
          const p = await fetch(`${base}/rest/v1/passwords?member_id=eq.900057&select=member_id&limit=1`, {headers})
          if (!p.ok) throw new Error('password status HTTP ' + p.status)
          const pr = await p.json()
          console.log('ROOT_STORED_CREDENTIAL_EXISTS=' + (pr.length === 1))
          const m = await fetch(`${base}/rest/v1/password_meta?member_id=eq.900057&select=member_id,is_default,changed_at,reset_by&limit=1`, {headers})
          if (!m.ok) throw new Error('password meta HTTP ' + m.status)
          const mr = await m.json()
          console.log('ROOT_PASSWORD_META=' + JSON.stringify(mr[0] ?? null))
          NODE
