name: Production Acceptance Final

on:
  push:
    branches:
      - codex/production-acceptance-final
    paths:
      - .github/workflows/production-acceptance-final.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      BASE_URL: https://downline-analyzer.vercel.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Production configuration
        run: npx vercel@56.3.1 pull --yes --environment=production --scope=bossjoes-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Live production acceptance
        id: live
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .vercel/.env.production.local
          set +a

          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { SignJWT } from 'jose'

          const base = process.env.BASE_URL
          const jwtSecret = process.env.JWT_SECRET
          const rootId = process.env.NEXT_PUBLIC_ROOT_MEMBER_ID || '900057'
          if (!base || !jwtSecret || jwtSecret.length < 32) throw new Error('Production JWT configuration unavailable')

          const json = async (url, options = {}) => {
            const response = await fetch(url, { redirect: 'manual', ...options })
            const text = await response.text()
            let data = null
            try { data = text ? JSON.parse(text) : null } catch {}
            return { response, text, data }
          }
          const assert = (condition, message) => {
            if (!condition) throw new Error(message)
          }

          const version = await json(`${base}/api/version`)
          assert(version.response.ok, `/api/version HTTP ${version.response.status}`)
          console.log('PASS version', version.data?.revision || 'unknown')

          const health = await json(`${base}/api/chat`)
          assert(health.response.ok && health.data?.online === true, `Coach health failed: ${health.text.slice(0,300)}`)
          const groq = health.data.providers?.find((p) => p.provider === 'groq')
          const openrouter = health.data.providers?.find((p) => p.provider === 'openrouter')
          assert(groq?.online === true, `Groq not online: ${JSON.stringify(groq)}`)
          assert(openrouter?.online === true, `OpenRouter not online: ${JSON.stringify(openrouter)}`)
          console.log('PASS provider health groq+openrouter online')

          const token = await new SignJWT({ memberId: rootId, name: 'Production Acceptance', isAdmin: true })
            .setProtectedHeader({ alg: 'HS256' })
            .setIssuedAt()
            .setExpirationTime('15m')
            .sign(new TextEncoder().encode(jwtSecret))
          const adminCookie = `dl_session=${token}`
          const authHeaders = { cookie: adminCookie }

          const dashboard = await fetch(`${base}/`, { headers: authHeaders, redirect: 'manual' })
          const dashboardHtml = await dashboard.text()
          assert(dashboard.status === 200 && dashboardHtml.includes('Dashboard'), `Dashboard failed HTTP ${dashboard.status}`)
          console.log('PASS Dashboard')

          const summary = await json(`${base}/api/summary`, { headers: authHeaders })
          assert(summary.response.ok && Array.isArray(summary.data?.months) && summary.data.months.length > 0, `Summary failed: ${summary.text.slice(0,200)}`)
          const latestMonth = summary.data.months[0]
          const members = await json(`${base}/api/members?month=${encodeURIComponent(latestMonth)}`, { headers: authHeaders })
          assert(members.response.ok && Array.isArray(members.data?.members) && members.data.members.length > 0, `Members API failed: ${members.text.slice(0,200)}`)
          console.log('PASS member lookup', members.data.members.length, 'members', 'month', latestMonth)

          let loginCookie = ''
          let loginMember = ''
          const attempts = []
          if (process.env.ROOT_INITIAL_PASSWORD) attempts.push({ id: rootId, password: process.env.ROOT_INITIAL_PASSWORD })
          for (const member of members.data.members) {
            const id = String(member.id || '')
            if (!id || id === rootId) continue
            attempts.push({ id, password: id })
            if (attempts.length >= 12) break
          }
          for (const attempt of attempts) {
            const login = await json(`${base}/api/auth/login`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ memberId: attempt.id, password: attempt.password }),
            })
            if (login.response.status === 200 && login.data?.ok === true) {
              const cookie = (login.response.headers.get('set-cookie') || '').split(';')[0]
              if (cookie.startsWith('dl_session=')) {
                loginCookie = cookie
                loginMember = attempt.id
                break
              }
            }
          }
          assert(loginCookie, 'No production account accepted its configured/default credential during login acceptance')
          console.log('PASS Login member', loginMember)

          const myPage = await fetch(`${base}/my`, { headers: { cookie: loginCookie }, redirect: 'manual' })
          if (loginMember === rootId) {
            assert([200, 307, 308].includes(myPage.status), `Authenticated root navigation failed HTTP ${myPage.status}`)
          } else {
            assert(myPage.status === 200, `/my failed HTTP ${myPage.status}`)
          }
          console.log('PASS authenticated navigation')

          const teamHealth = await json(`${base}/api/team-health?member=${encodeURIComponent(rootId)}&month=${encodeURIComponent(latestMonth)}`, { headers: authHeaders })
          assert(teamHealth.response.ok, `Team Health failed HTTP ${teamHealth.response.status}: ${teamHealth.text.slice(0,250)}`)
          assert(String(teamHealth.data?.member?.id || '') === rootId, 'Team Health returned unexpected root member')
          console.log('PASS Team Health')

          const coach = await json(`${base}/api/coach`, { headers: authHeaders })
          assert(coach.response.ok && coach.data?.member, `Coach data failed HTTP ${coach.response.status}: ${coach.text.slice(0,250)}`)
          const chat = await fetch(`${base}/api/chat`, {
            method: 'POST',
            headers: { ...authHeaders, 'content-type': 'application/json' },
            body: JSON.stringify({
              messages: [{ role: 'user', content: 'ทดสอบระบบ Production ตอบสั้น ๆ ว่า Coach JOE พร้อมใช้งาน' }],
              coachData: coach.data,
            }),
          })
          const chatText = await chat.text()
          const chatProvider = chat.headers.get('x-coach-provider') || 'unknown'
          assert(chat.ok && chatText.trim().length > 10, `Coach chat failed HTTP ${chat.status}: ${chatText.slice(0,250)}`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `coach_provider=${chatProvider}\n`)
          console.log('PASS Coach JOE response provider=' + chatProvider)

          const telegramConfig = await json(`${base}/api/telegram`, { headers: authHeaders })
          assert(telegramConfig.response.ok && telegramConfig.data?.configured === true, `Telegram not configured: ${telegramConfig.text.slice(0,250)}`)
          const telegramSend = await json(`${base}/api/telegram/send`, {
            method: 'POST',
            headers: { ...authHeaders, 'content-type': 'application/json' },
            body: JSON.stringify({ type: 'activity' }),
          })
          assert(telegramSend.response.ok && telegramSend.data?.success === true, `Telegram delivery failed HTTP ${telegramSend.response.status}: ${telegramSend.text.slice(0,250)}`)
          console.log('PASS Telegram real delivery')
          console.log('LIVE_ACCEPTANCE_PASS')
          NODE

      - name: Force Groq failure and verify OpenRouter takeover
        id: failover
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .vercel/.env.production.local
          set +a

          cat > tests/production-failover.live.test.ts <<'TEST'
          import { expect, test } from 'vitest'

          test('production OpenRouter takes over when Groq fails', async () => {
            process.env.GROQ_API_KEY = 'acceptance-invalid-groq-key'
            process.env.AI_TIMEOUT_MS = '10000'
            process.env.AI_MAX_TOKENS = '32'
            const { generateCoachReply } = await import('../src/lib/coach-ai')
            const result = await generateCoachReply([{ role: 'user', content: 'Reply exactly OK.' }])
            console.log(`FAILOVER_PROVIDER=${result.provider} MODEL=${result.model}`)
            expect(result.provider).toBe('openrouter')
            expect(result.content.trim().length).toBeGreaterThan(0)
          })
          TEST

          npx vitest run tests/production-failover.live.test.ts --reporter=verbose
          rm -f tests/production-failover.live.test.ts

      - name: Inspect Vercel production runtime errors
        id: logs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@56.3.1 logs --environment production --status-code 5xx --since 1h --limit 100 --json --scope=bossjoes-projects --token=${{ secrets.VERCEL_TOKEN }} > /tmp/vercel-5xx.jsonl
          npx vercel@56.3.1 logs --environment production --level error --since 1h --limit 100 --json --scope=bossjoes-projects --token=${{ secrets.VERCEL_TOKEN }} > /tmp/vercel-errors.jsonl
          npx vercel@56.3.1 logs --environment production --query "coach_ai_provider_failed" --since 1h --limit 100 --json --scope=bossjoes-projects --token=${{ secrets.VERCEL_TOKEN }} > /tmp/vercel-provider-failures.jsonl

          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const parse = (path) => fs.readFileSync(path, 'utf8').split(/\r?\n/).filter(Boolean).flatMap((line) => {
            try { return [JSON.parse(line)] } catch { return [] }
          })
          const five = parse('/tmp/vercel-5xx.jsonl')
          const errors = parse('/tmp/vercel-errors.jsonl')
          const providerFailures = parse('/tmp/vercel-provider-failures.jsonl')
          console.log(`VERCEL_5XX_COUNT=${five.length}`)
          console.log(`VERCEL_ERROR_LOG_COUNT=${errors.length}`)
          console.log(`COACH_PROVIDER_FAILURE_COUNT=${providerFailures.length}`)
          if (five.length) console.log('5xx samples:', five.slice(0, 5).map((x) => ({ path: x.requestPath || x.path, statusCode: x.statusCode, message: x.message })))
          if (errors.length) console.log('error samples:', errors.slice(0, 5).map((x) => ({ path: x.requestPath || x.path, statusCode: x.statusCode, message: x.message })))
          if (providerFailures.length) console.log('provider failure samples:', providerFailures.slice(0, 5).map((x) => ({ path: x.requestPath || x.path, level: x.level, message: x.message })))
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `five_count=${five.length}\nerror_count=${errors.length}\nprovider_failure_count=${providerFailures.length}\n`)
          NODE

      - name: Production Ready Gate
        if: always()
        env:
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          LIVE_PROVIDER: ${{ steps.live.outputs.coach_provider }}
          FAILOVER_OUTCOME: ${{ steps.failover.outcome }}
          LOGS_OUTCOME: ${{ steps.logs.outcome }}
          VERCEL_5XX_COUNT: ${{ steps.logs.outputs.five_count }}
          VERCEL_ERROR_COUNT: ${{ steps.logs.outputs.error_count }}
          PROVIDER_FAILURE_COUNT: ${{ steps.logs.outputs.provider_failure_count }}
        run: |
          echo "LIVE_OUTCOME=$LIVE_OUTCOME"
          echo "LIVE_PROVIDER=$LIVE_PROVIDER"
          echo "FAILOVER_OUTCOME=$FAILOVER_OUTCOME"
          echo "LOGS_OUTCOME=$LOGS_OUTCOME"
          echo "VERCEL_5XX_COUNT=$VERCEL_5XX_COUNT"
          echo "VERCEL_ERROR_COUNT=$VERCEL_ERROR_COUNT"
          echo "PROVIDER_FAILURE_COUNT=$PROVIDER_FAILURE_COUNT"

          if [ "$LIVE_OUTCOME" != "success" ] || [ "$FAILOVER_OUTCOME" != "success" ] || [ "$LOGS_OUTCOME" != "success" ]; then
            echo "DOWNLINE ANALYZER NOT READY"
            exit 1
          fi
          if [ "$LIVE_PROVIDER" != "groq" ]; then
            echo "DOWNLINE ANALYZER NOT READY: primary Coach provider is $LIVE_PROVIDER"
            exit 1
          fi
          if [ "${VERCEL_5XX_COUNT:-999}" != "0" ] || [ "${VERCEL_ERROR_COUNT:-999}" != "0" ]; then
            echo "DOWNLINE ANALYZER NOT READY: Vercel runtime errors detected"
            exit 1
          fi

          echo "DOWNLINE ANALYZER PRODUCTION READY"
