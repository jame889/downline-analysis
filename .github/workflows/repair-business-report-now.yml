name: Repair Business Report Production Sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-business-report-now.yml

permissions:
  contents: read

concurrency:
  group: repair-business-report-production-sync
  cancel-in-progress: false

jobs:
  sync-now:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report dependencies
        run: python -m pip install openpyxl requests
      - name: Verify parser regression
        run: python -m unittest discover -s scripts -p 'test_business_report_columns.py'
      - name: Sync current Business Report to Production
        env:
          FIRST_THAILAND_USER: ${{ secrets.FIRST_THAILAND_USER }}
          FIRST_THAILAND_PASSWORD: ${{ secrets.FIRST_THAILAND_PASSWORD }}
          BUSINESS_REPORT_SYNC_SECRET: ${{ secrets.BUSINESS_REPORT_SYNC_SECRET }}
          BUSINESS_REPORT_SYNC_URL: https://downline-analyzer.vercel.app/api/admin/business-report-sync
        run: |
          set -euo pipefail
          output=$(python scripts/sync_business_report.py --month 2026-09 --output-dir downloaded_reports)
          echo "$output"
          REPORT_OUTPUT="$output" python - <<'PY'
          import json, os
          lines = [line for line in os.environ["REPORT_OUTPUT"].splitlines() if line.strip().startswith("{")]
          assert lines, "No sync result emitted"
          result = json.loads(lines[-1])
          production = result.get("production") or {}
          assert result["rows"] >= 501, result
          assert production.get("ok") is True, production
          assert production.get("supabaseSynced") is True, production
          print("PRODUCTION_SYNC_PASS", json.dumps({
              "month": result["month"],
              "rows": result["rows"],
              "members": result["members"],
              "checksum": result["checksum"],
              "jarvisPushed": production.get("jarvisPushed"),
              "jarvisPushStatus": production.get("jarvisPushStatus"),
          }))
          PY
      - name: Broadcast refreshed Daily Action
        env:
          BUSINESS_REPORT_SYNC_SECRET: ${{ secrets.BUSINESS_REPORT_SYNC_SECRET }}
        run: |
          response=$(curl --fail-with-body --show-error --silent --location \
            --request POST \
            --header "Authorization: Bearer $BUSINESS_REPORT_SYNC_SECRET" \
            --header "Content-Type: application/json" \
            --data '{"type":"report"}' \
            https://downline-analyzer.vercel.app/api/admin/telegram-broadcast)
          echo "$response"
          BROADCAST_RESPONSE="$response" python -c 'import json,os; p=json.loads(os.environ["BROADCAST_RESPONSE"]); assert p.get("ok") is True, p'
      - name: Verify persisted sync status
        env:
          BUSINESS_REPORT_SYNC_SECRET: ${{ secrets.BUSINESS_REPORT_SYNC_SECRET }}
        run: |
          response=$(curl --fail-with-body --show-error --silent \
            --header "Authorization: Bearer $BUSINESS_REPORT_SYNC_SECRET" \
            https://downline-analyzer.vercel.app/api/admin/business-report-sync)
          echo "$response"
          SYNC_STATUS="$response" python - <<'PY'
          import json, os
          payload = json.loads(os.environ["SYNC_STATUS"])
          status = payload.get("status") or {}
          assert payload.get("ok") is True, payload
          assert status.get("ok") is True, status
          assert status.get("supabaseSynced") is True, status
          assert status.get("rows", 0) >= 501, status
          print("PERSISTED_SYNC_STATUS_PASS", status.get("month"), status.get("rows"))
          PY
      - name: Archive repaired source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repaired-business-report-${{ github.run_id }}
          path: downloaded_reports/*.xlsx
          if-no-files-found: ignore
          retention-days: 30
